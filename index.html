<!DOCTYPE html>
<html>
<head>
    <title>NCC Attendance App</title>
    <link rel="stylesheet" href="style.css?v=2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

    <h1>NCC Attendance Report Generator</h1>

    <!-- Tab Bar for Switching Sets of Names -->
    <div class="tabs">
        <button type="button" class="tab-btn active" data-tab="tab1" onclick="switchTab('tab1')">Set 1</button>
        <button type="button" class="tab-btn" data-tab="tab2" onclick="switchTab('tab2')">Set 2</button>
        <button type="button" class="tab-btn" data-tab="tab3" onclick="switchTab('tab3')">Set 3</button>
    </div>

    <label>Year:</label>
    <input type="text" id="year" placeholder="2nd Year SD">

    <label>Total Strength (Auto-Calculated):</label>
    <input type="number" id="strength" placeholder="0" readonly>

    <h2>Cadets</h2>

    <textarea id="cadetNames" rows="10"
        placeholder="Enter one cadet name per line"></textarea>

    <br><br>
    
   <br><br>
    
    <!-- Added Reset Button here -->
    <button onclick="resetAllToPresent()">Reset All to Present</button>
    <button onclick="clearCadets()">Clear Saved Names</button>

    <div id="attendanceSection"></div>

    <br>

    <button onclick="generateReport()">Generate Report</button>
    <button class="copy-btn" onclick="copyReport()">📋 Copy Report</button>
    <!-- Added WhatsApp Button here -->
    <button class="whatsapp-btn" onclick="shareToWhatsApp()">📲 WhatsApp</button>

    <h2>Generated Report</h2>
    <textarea id="report" rows="20"></textarea>

    <script src="script.js?v=2"></script>

</body>
</html>
